name: Deploy Frontend to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Verify SSH key fingerprint
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e

          echo "========================================"
          echo "Verifying SSH key"
          echo "========================================"

          printf '%s\n' "$SSH_KEY" > /tmp/github_actions_key
          chmod 600 /tmp/github_actions_key

          ssh-keygen -y -f /tmp/github_actions_key > /tmp/github_actions_pub

          echo "SSH key fingerprint:"
          ssh-keygen -lf /tmp/github_actions_pub

          rm -f /tmp/github_actions_key /tmp/github_actions_pub

      - name: Test SSH connection
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -e

          echo "========================================"
          echo "Testing SSH connection"
          echo "========================================"

          printf '%s\n' "$SSH_KEY" > /tmp/github_actions_key
          chmod 600 /tmp/github_actions_key

          ssh \
            -i /tmp/github_actions_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "$VPS_USER@$VPS_HOST" \
            "echo 'SSH authentication successful'"

          rm -f /tmp/github_actions_key

          echo "========================================"
          echo "SSH connection successful"
          echo "========================================"